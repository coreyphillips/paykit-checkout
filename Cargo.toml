[package]
name = "paykit-checkout"
version = "0.1.0"
edition = "2024"
publish = false
license = "MIT"
description = "A self-hosted Bitcoin merchant checkout for Paykit and guest wallets"
repository = "https://github.com/coreyphillips/paykit-checkout"

[dependencies]
anyhow = "1"
axum = { version = "0.8", default-features = false, features = ["http1", "tokio", "json", "form"] }
base64 = "0.22"
bitcoin = "0.32"
clap = { version = "4.6", features = ["derive"] }
data-encoding = "2"
ed25519-dalek = "2"
electrum-client = "0.25"
hex = "0.4"
hmac = "0.12"
lightning-invoice = { version = "0.33", features = ["std"] }
qrcode = { version = "0.14", default-features = false, features = ["svg"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "native-tls", "json"] }
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_json_canonicalizer = "0.3"
sha2 = "0.10"
subtle = "2"
time = { version = "0.3", features = ["parsing"] }
tokio = { version = "1", features = ["macros", "net", "rt-multi-thread", "time"] }
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
tempfile = "3"
