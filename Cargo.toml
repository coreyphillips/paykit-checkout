[package]
name = "paykit-checkout"
version = "0.1.0"
edition = "2024"
publish = false
license = "MIT"
description = "A self-hosted Bitcoin merchant checkout for Paykit and guest wallets"
repository = "https://github.com/coreyphillips/paykit-checkout"

[dependencies]
anyhow = "1"
axum = { version = "0.8", default-features = false, features = ["http1", "tokio"] }
bitcoin = "0.32"
clap = { version = "4.6", features = ["derive"] }
qrcode = { version = "0.14", default-features = false, features = ["svg"] }
rusqlite = { version = "0.32", features = ["bundled"] }
tokio = { version = "1", features = ["macros", "net", "rt-multi-thread"] }

[dev-dependencies]
tempfile = "3"
