name: Check

on: [push, pull_request]

permissions:
  contents: read

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - run: rustup update stable --no-self-update
      - run: rustup component add --toolchain stable rustfmt clippy
      - run: cargo +stable fmt --check
      - run: cargo +stable clippy --locked --all-targets -- -D warnings
      - run: cargo +stable test --locked
      - name: Check WooCommerce PHP and JavaScript
        run: |
          for file in integrations/woocommerce/paykit-checkout/*.php; do
            php -l "$file"
          done
          node --check integrations/woocommerce/paykit-checkout/blocks.js
      - name: Verify Bitcoin settlement and reorg recovery on regtest
        run: python3 tests/regtest-chain/run.py
